<style>

.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}.lg span{display:flex;align-items:center;gap:4px}.card p{margin:0}

.logo{border:0;background:none;font-size:25px;font-weight:700;letter-spacing:.02em;padding:0}.logo span{color:var(--acc)}
.rv{margin-bottom:14px;padding:4px 0 8px;border-bottom:1px dashed var(--line)}.rvh{display:flex;justify-content:space-between;width:100%;border:0;background:none;font-weight:700;padding:4px 0}

.rv ul button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 6px;border-radius:6px;text-align:left;font-size:14px}.rv ul button:hover{background:var(--bg)}
#sideOpen{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:30;border:1px solid var(--line);background:var(--pn);border-radius:99px;width:38px;height:38px;font-size:17px}
body.noside #sideOpen{display:block}body.noside #side{display:none}body.noside #app{grid-template-columns:minmax(0,1fr) 380px}
.card{border:0;background:var(--bg);border-radius:16px}
@media(max-width:980px){#side,#gsec{position:static;height:auto}#main{padding:20px 16px;min-height:0}#main::before{display:none}#sideOpen,body.noside #sideOpen{display:none}body.noside #side{display:block}body.noside #app{grid-template-columns:1fr}.burger{display:none}}
mark{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--acc) 28%,transparent) 60%);color:inherit;padding:0 4px;margin:0 -4px}
.tabs{gap:6px;margin:20px 0 14px}.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:12px 12px 0 0;padding:6px 16px 5px;margin-bottom:-1px;color:var(--mute)}
.tabs .on{background:var(--pn);color:var(--ink);font-weight:700;box-shadow:inset 0 3px var(--acc)}
.chip{transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,0,0,.18)}.badge{border-style:dashed}
.ops>button,.ops .btn{border-radius:99px}.ops .pri,.tbar .pri{box-shadow:0 2px 0 rgba(0,0,0,.2)}.ops button:not(:disabled):active,.tbar button:active{transform:translateY(1px)}
.sheet{font-size:16px;line-height:32px;padding:32px 34px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-attachment:local}
.sheet h2{font-size:22px;line-height:32px;margin:32px 0 0}.sheet ul,.sheet ol{margin:0}
.todo li button{transition:transform .15s,background .15s}.todo li button:hover{transform:translateY(-2px) rotate(-.4deg)}
.gh{margin:0 0 6px;font-weight:700;color:var(--mute);font-size:13px}
.face path{fill:none;stroke:#2a2740;stroke-width:1.8;stroke-linecap:round}.face circle{fill:#2a2740;stroke:none}
.node{animation:bob 5s ease-in-out infinite}.node:nth-of-type(3n+2){animation-delay:-1.7s}.node:nth-of-type(3n){animation-delay:-3.3s}
@keyframes bob{50%{transform:translateY(-3px)}}.node:hover>circle:not(.ring){transform:scale(1.07);transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.node{animation:none}.todo li button:hover{transform:none}}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head>
<body><div id="app"><section id="side" aria-label="教材"></section><section id="main" aria-label="学習画面"></section><section id="gsec" aria-label="関連図"><div id="graph"></div></section></div>
<nav class="bn" aria-label="画面切り替え"><button data-act="pane" data-p="side">教材</button><button data-act="pane" data-p="main">学習</button><button data-act="pane" data-p="graph">関連図</button></nav><button id="sideOpen" data-act="side" aria-label="サイドバーを開く">☰</button><div id="toast" role="status"></div>
<script>
const DAY = 864e5;
const mk = (id, title, prereqs = []) => ({ id, title, prereqs, note: "", history: [], srcText: "", sources: [], questions: [] });
// ===== クラウド上の運営教材（将来はAPI / GitHub から取得） =====
const CLOUD = [
    { id: "c-la", title: "線形代数", src: "official", items: [mk("vec", "ベクトル"), mk("mat", "行列の演算", ["vec"]), mk("det", "行列式", ["mat"]), mk("eig", "固有値・固有ベクトル", ["det"])] },
    { id: "c-calc", title: "微分積分", src: "official", items: [mk("lim", "極限"), mk("diff", "微分", ["lim"]), mk("int", "積分", ["diff"]), mk("tay", "テイラー展開", ["diff"])] },
    { id: "c-stat", title: "統計学入門", src: "official", items: [mk("dist", "確率分布"), mk("est", "推定", ["dist"]), mk("test", "仮説検定", ["est"])] },
];
function seed() {
    const la = clone(CLOUD[0]);
    const db = { id: "u-db", title: "大学のデータベース", src: "user", items: [
            mk("er", "ER図"), mk("norm", "正規化", ["er"]), mk("sql", "SQL基礎"), mk("sel", "SELECT文", ["sql"]), mk("join", "JOIN", ["sel"])
        ] };
    const now = Date.now();
    db.items[2].note = "SQLはリレーショナルDBに問い合わせる言語。";
    db.items[2].history.push({ at: now - 2 * DAY, kind: "test", score: 5 });
    db.items[3].history.push({ at: now - 9 * DAY, kind: "test", score: 3 });
    db.items[0].history.push({ at: now - 1 * DAY, kind: "note" });
    return { subjects: [la, db], sel: { s: "u-db", i: "join" }, tab: "src", hint: false, rate: 0, busy: "", qi: 0, reveal: false, full: false, pane: "main", reviewOpen: true, sideOpen: true };
}
function clone(x) { return JSON.parse(JSON.stringify(x)); }
// ===== 状態 =====
let st;
try {
    const raw = localStorage.getItem("manabi-v2");
    st = raw ? JSON.parse(raw) : seed();
}
catch {
    st = seed();
}
st.subjects.forEach(s => s.items.forEach(i => { i.sources ??= []; i.questions ??= []; i.srcText ??= ""; }));
st.full = false;
st.pane ??= "main";
st.reviewOpen ??= true;
st.sideOpen ??= true;
let draft = "", notice = "";
const toHtml = (t) => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/\n/g, "<br>");
function syncNote(it) { const ed = document.getElementById("note"); if (!ed)
    return; it.noteHtml = ed.innerHTML; it.note = ed.innerText; }
const save = () => { try {
    localStorage.setItem("manabi-v2", JSON.stringify(st));
}
catch { /* 保存できなくても動作は継続 */ } };
// 復習度 0:未学習 1:要復習 2:定着中 3:定着
function level(it) {
    if (!it.history.length)
        return 0;
    const t = [...it.history].reverse().find(h => h.kind === "test");
    if (!t || t.score == null)
        return 1;
    const d = (Date.now() - t.at) / DAY;
    if (t.score >= 4 && d < 7)
        return 3;
    if (t.score >= 3 && d < 14)
        return 2;
    return 1;
}
function ret(it) {
    if (!it.history.length)
        return -1;
    const t = [...it.history].reverse().find(h => h.kind === "test");
    if (!t || t.score == null)
        return .15;
    return (t.score / 5) * Math.exp(-((Date.now() - t.at) / DAY) / (2 + t.score * 3));
}
const hue = (it) => { const r = ret(it); return r < 0 ? "var(--l0)" : `hsl(${Math.round(28 + r * 135)} 62% ${Math.round(48 - r * 6)}%)`; };
// ノードの顔：記憶の残り具合で表情が変わる（笑顔→ふつう→困り顔／未学習はおやすみ顔）
function face(i, x, y, r) {
    const q = ret(i), m = q < 0 ? 0 : q > .55 ? 2 : q > .25 ? 1 : -1;
    const mouth = { 0: "M-3 7h6", 1: "M-5 6Q0 9 5 6", 2: "M-6 4Q0 12 6 4", [-1]: "M-6 9Q0 3 6 9" };
    const eyes = m === 0 ? `<path d="M-9 -3h5M4 -3h5"/>` : `<circle cx="-6" cy="-3" r="2"/><circle cx="6" cy="-3" r="2"/>`;
    return `<g class="face" transform="translate(${x} ${y}) scale(${r / 24})">${eyes}<path d="${mouth[m]}"/></g>`;
}
const greet = () => { const h = new Date().getHours(); return h < 5 ? "夜ふかしだね" : h < 11 ? "おはよう" : h < 18 ? "こんにちは" : "おつかれさま"; };
const LV = ["未学習", "要復習", "定着中", "定着"];
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const subj = () => st.subjects.find(s => s.id === st.sel?.s);
const item = () => subj()?.items.find(i => i.id === st.sel?.i);
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const sents = (t) => t.split(/[。\n]/).map(x => x.trim()).filter(x => x.length > 4);
const mockAI = {
    async summarize({ title, text }) { await wait(700); const a = sents(text).slice(0, 4); return a.length ? `【${title}の要約】\n` + a.map(x => "・" + x).join("\n") : ""; },
    async questions({ title, text }) { await wait(700); return sents(text).slice(0, 5).map(x => ({ q: `${title}について、次の内容を説明してください：${x.slice(0, Math.ceil(x.length / 2))}…`, a: x })); },
};
const ai = mockAI;
function shrink(f) {
    return new Promise(res => {
        const r = new FileReader();
        r.onload = () => {
            const im = new Image();
            im.onload = () => {
                const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
                c.width = im.width * k;
                c.height = im.height * k;
                c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
                res(c.toDataURL("image/jpeg", .6));
            };

async function runAI(kind, it) {
    const t = document.getElementById("stext");
    if (t)
        it.srcText = t.value;
    syncNote(it);
    const inp = { title: it.title, text: it.srcText || it.note, images: it.sources.map(x => x.url) };
    st.busy = kind;
    render();
    if (kind === "ai-sum") {
        const out = await ai.summarize(inp);
        if (out) {
            const prev = it.noteHtml ?? toHtml(it.note);
            it.noteHtml = (prev ? prev + "<br><br>" : "") + toHtml(out);
            it.note = it.note ? it.note + "\n\n" + out : out;
            it.history.push({ at: Date.now(), kind: "note" });
            st.tab = "note";
            notice = "";
        }
        else
            notice = "まとめる文字がまだないよ。「資料の文字」に写真の内容を入れてね。";
    }
    else {
        const qs = await ai.questions(inp);
        if (qs.length) {
            it.questions = qs;
            st.qi = 0;
            st.reveal = false;
            st.tab = "test";
            notice = "";
        }
        else
            notice = "問題にする文字がまだないよ。「資料の文字」に写真の内容を入れてね。";
    }
    st.busy = "";
    render();
}
const prog = (s) => s.items.length ? s.items.reduce((a, i) => a + level(i), 0) / s.items.length : 0;

        `<text x="55" y="53" class="big">${cnt[3]}/${all.length}</text><text x="55" y="69" class="sm">定着</text></svg>`;

    }).join("") + `<line x1="0" y1="52" x2="154" y2="52"/></svg>`;
    const dash = `<div class="dash"><div class="card">${donut}<div class="lg">${LV.map((n, l) => `<span><i class="dot l${l}"></i>${n} ${cnt[l]}</span>`).join("")}</div></div><div class="card"><b>直近14日の学習</b>${bars}<p class="mute">${streak ? `🔥 ${streak}日連続でやってるよ` : "今日から始めよう"}</p></div></div>`;
    const todo = st.subjects.flatMap(s => s.items.map(i => ({ s, i, l: level(i) }))).filter(x => x.l < 3).sort((a, b) => order.indexOf(a.l) - order.indexOf(b.l)).slice(0, 8);

    };

        ? `<ul class="todo">${todo.map(x => `<li><button data-act="open" data-tab="${x.l === 0 ? "src" : "test"}" data-s="${x.s.id}" data-i="${x.i.id}"><i class="dot l${x.l}"></i><span><b>${esc(x.i.title)}</b><small>${esc(x.s.title)}・${why(x.i)}</small></span><em>${x.l === 0 ? "資料を入れる" : "説明テスト"}</em></button></li>`).join("")}</ul>`

function renderGraph() {
    const s = subj();
    if (!s) {
        $("graph").innerHTML = "";
        return;
    }
    const depth = {};
    const d = (i) => depth[i.id] ??= i.prereqs.length ? 1 + Math.max(...i.prereqs.map(p => d(s.items.find(x => x.id === p)))) : 0;
    s.items.forEach(d);
    const cols = {};
    s.items.forEach(i => (cols[depth[i.id]] ??= []).push(i));
    const pos = {};
    Object.entries(cols).forEach(([c, arr]) => arr.forEach((i, r) => (pos[i.id] = [50 + +c * 110, 50 + r * 80])));
    const W = 100 + (Math.max(...Object.keys(cols).map(Number)) + 1) * 110, H = 100 + Math.max(...Object.values(cols).map(a => a.length)) * 80;
    const sel = st.sel?.s === s.id ? st.sel.i : "", cur = s.items.find(x => x.id === sel);
    const rel = new Set(cur ? [cur.id, ...cur.prereqs, ...s.items.filter(x => x.prereqs.includes(cur.id)).map(x => x.id)] : []);
    const edges = s.items.flatMap(i => i.prereqs.map(p => `<line class="${i.id === sel || p === sel ? "hi" : ""}" x1="${pos[p][0]}" y1="${pos[p][1]}" x2="${pos[i.id][0]}" y2="${pos[i.id][1]}"/>`)).join("");
    const nodes = s.items.map(i => {
        const [x, y] = pos[i.id], r = 20 + Math.min(10, i.history.length * 2);
        return `<g class="node ${sel === i.id ? "on" : ""} ${cur && !rel.has(i.id) ? "dim" : ""}" data-act="open" data-s="${s.id}" data-i="${i.id}" tabindex="0">${level(i) === 1 ? `<circle class="ring" cx="${x}" cy="${y}" r="${r}"/>` : ""}<circle cx="${x}" cy="${y}" r="${r}" fill="${hue(i)}"/>${face(i, x, y, r)}<text x="${x}" y="${y + r + 16}">${esc(i.title)}</text></g>`;
    }).join("");
    $("graph").innerHTML = `<p class="gh">${esc(s.title)}のつながり</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="学習項目の関連図">${edges}${nodes}</svg>` +
        `<div class="legend"><span>忘れかけ</span><i class="grad"></i><span>定着</span><span><i class="dot l0"></i>未学習</span><span>円が大きいほど学習回数が多い</span></div>`;
}

document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el)
        return;
    const a = el.dataset.act, it = item();
    if (it)
        syncNote(it);
    if (a === "open" || a === "subj") {
        const s = st.subjects.find(x => x.id === el.dataset.s);
        if (!s)
            return;
        st.sel = { s: s.id, i: el.dataset.i ?? s.items[0]?.id };
        st.pane = "main";
        if (el.dataset.tab)
            st.tab = el.dataset.tab;
        st.hint = false;
        st.rate = 0;
        st.reveal = false;
        draft = "";
    }
    else if (a === "tab") {
        st.tab = el.dataset.t;
        st.hint = false;
        st.rate = 0;
        st.reveal = false;
        draft = "";
    }
    else if (a === "ai-sum" || a === "ai-q") {
        if (it)
            void runAI(a, it);
        return;
    }
    else if (a === "delimg" && it)
        it.sources.splice(Number(el.dataset.k), 1);
    else if (a === "savetext" && it)
        it.srcText = $("stext").value;
    else if (a === "qi") {
        st.qi = Number(el.dataset.k);
        st.reveal = false;
        draft = "";
    }
    else if (a === "reveal")
        st.reveal = !st.reveal;
    else if (a === "rv")
        st.reviewOpen = !st.reviewOpen;
    else if (a === "side")
        st.sideOpen = !st.sideOpen;
    else if (a === "home") {
        st.sel = null;
        st.pane = "main";
        st.full = false;
    }
    else if (a === "pane")
        st.pane = el.dataset.p;
    else if (a === "full")
        st.full = !st.full;
    else if (a === "hint")
        st.hint = !st.hint;
    else if (a === "rate")
        st.rate = Number(el.dataset.n);
    else if (a === "savenote" && it) {
        syncNote(it);
        it.history.push({ at: Date.now(), kind: "note" });
        toast("保存したよ");
    }
    else if (a === "savetest" && it) {
        it.history.push({ at: Date.now(), kind: "test", score: st.rate, text: $("ans").value });
        st.rate = 0;
        st.hint = false;
        draft = "";
    }
    else if (a === "install") {
        const c = CLOUD.find(x => x.id === el.dataset.s);
        if (c)
            st.subjects.push(clone(c));
    }
    render();
});
const count = () => { const n = document.getElementById("note"), c = document.getElementById("cnt"); if (n && c)
    c.textContent = n.innerText.replace(/\s/g, "").length + "文字"; };
document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "ans")
        draft = t.value;
    if (t.id === "note") {
        count();
        autosave();
    }
    if (t.id === "stext") {

document.addEventListener("mousedown", e => {
    const b = e.target.closest("[data-cmd]");
    if (!b)
        return;
    e.preventDefault();

    document.execCommand(c, false, c === "formatBlock" ? b.dataset.v : undefined);
});
document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        const it = item();
        if (it && st.tab === "note") {
            syncNote(it);
            it.history.push({ at: Date.now(), kind: "note" });
            save();
            toast("保存したよ");
        }
        return;
    }

document.addEventListener("change", async (e) => {
    const t = e.target, it = item();
    if (!t.hasAttribute("data-file") || !it || !t.files)
        return;
    const box = document.getElementById("stext");
    if (box)
        it.srcText = box.value;

document.addEventListener("submit", e => {
    e.preventDefault();

    if (!t)
        return;
    if (f.dataset.form === "subject") {
        const id = "u-" + Date.now();
        st.subjects.push({ id, title: t, src: "user", items: [] });
        st.sel = null;
    }
    else {
        const s = st.subjects.find(x => x.id === f.dataset.s);
        const p = f.elements.namedItem("p").value;
        if (s) {
            const n = mk("i" + Date.now(), t, p ? [p] : []);
            s.items.push(n);
            st.sel = { s: s.id, i: n.id };
        }
    }
    render();

render();
