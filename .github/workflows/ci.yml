name: CI

on:
  push:
    branches:
      - main
      - pm/stabilization
      - 'fix/**'

  pull_request:
    branches:
      - main
      - pm/stabilization

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Show environment versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: TypeScript test type check
        run: npx tsc --noEmit -p tsconfig.qa.json

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Backend syntax check
        shell: bash
        run: |
          find server/src -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Frontend security audit
        run: npm audit

      - name: Backend security audit
        run: npm audit
        working-directory: server